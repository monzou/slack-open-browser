<!doctype html>
<!--
  Source for the Chrome Web Store screenshots and promo tile.

  One page renders every asset: pick it with ?screen=hero|highlight|trust|tile
  and ?lang=en|ja. scripts/render-store-assets.sh screenshots each combination
  with headless Chrome, so text layout and CJK fonts come from the browser
  instead of hand-positioned SVG <text>.

  The palette deliberately avoids Slack's own brand colours (aubergine
  #4A154B, yellow #ECB22E) so the listing does not read as an official Slack
  product; the accent is the extension's actual highlight colour
  (highlight.css: rgb(242, 199, 68)).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store assets</title>
<style>
  :root {
    --bg-1: #17132B;
    --bg-2: #2A2150;
    --ink: #FFFFFF;
    --ink-2: #CEC7E8;
    --ink-3: rgba(255, 255, 255, 0.5);
    --accent: #F2C744;
    --accent-ink: #2A1F05;
    /* The real highlight is rgba(242,199,68,0.1) over Slack's surface; it is
       drawn a bit stronger here so it survives the store's downscaled
       thumbnails. */
    --hl: #FCF1CF;
    --surface: #FFFFFF;
    --chrome: #EFECF4;
    --line: #ECE8F1;
    --skeleton: #E6E2EC;
    --text: #1D1C1D;
    --text-2: #7A7483;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 600px at 85% 15%, rgba(126, 96, 255, 0.28), transparent 70%),
      radial-gradient(700px 500px at 10% 100%, rgba(242, 199, 68, 0.08), transparent 70%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    -webkit-font-smoothing: antialiased;
  }

  :lang(ja) body, body:lang(ja) {
    font-family: "Hiragino Sans", "Helvetica Neue", sans-serif;
    font-feature-settings: "palt";
    /* Break Japanese at phrase boundaries instead of mid-word. */
    word-break: auto-phrase;
  }

  section { display: none; position: relative; width: 100%; height: 100%; }
  body[data-screen="hero"] #hero,
  body[data-screen="highlight"] #highlight,
  body[data-screen="trust"] #trust,
  body[data-screen="tile"] #tile { display: block; }

  .headline {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.01em;
  }
  :lang(ja) .headline { font-size: 46px; line-height: 1.3; letter-spacing: 0.01em; }

  .sub {
    font-size: 24px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  :lang(ja) .sub { font-size: 21px; line-height: 1.7; }

  .accent { color: var(--accent); }

  .disclaimer {
    position: absolute;
    left: 72px;
    bottom: 28px;
    font-size: 14px;
    line-height: 1.5;
    max-width: 440px;
    color: var(--ink-3);
  }
  :lang(ja) .disclaimer { font-size: 13px; }
  #trust .disclaimer { max-width: none; }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  [data-icon] { display: block; }
  [data-icon] img { display: block; width: 100%; height: 100%; }
  .brand [data-icon] { width: 44px; height: 44px; }
  /* The product name is English in every locale. */
  :lang(ja) .brand { font-family: "Helvetica Neue", Helvetica, sans-serif; }

  /* ---------- browser window mockup ---------- */

  .window {
    position: absolute;
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255,255,255,0.06);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .window .bar {
    height: 46px;
    background: var(--chrome);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
  }
  .window .dot { width: 12px; height: 12px; border-radius: 50%; }
  .window .url {
    margin-left: 14px;
    flex: 1;
    height: 28px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid #DCD6E3;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    font-size: 14px;
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
  }
  .window .url b { color: var(--text); font-weight: 500; }
  .window .channel {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    font-size: 19px;
    font-weight: 700;
    border-bottom: 1.5px solid var(--line);
  }
  .row {
    position: relative;
    display: flex;
    gap: 14px;
    padding: 16px 24px;
  }
  .row .avatar { flex: none; width: 40px; height: 40px; border-radius: 9px; }
  .row .body { flex: 1; display: flex; flex-direction: column; gap: 9px; padding-top: 2px; }
  .row .meta { display: flex; align-items: baseline; gap: 8px; font-size: 16px; }
  .row .meta b { font-weight: 700; }
  .row .meta span { font-size: 13px; color: var(--text-2); }
  .row .line { height: 11px; border-radius: 6px; background: var(--skeleton); }
  .row.hl { background: var(--hl); }
  .row.hl .line { background: #E9D9A3; }
  .row .tag {
    position: absolute;
    right: 22px;
    top: 16px;
    padding: 6px 14px 6px 12px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 12px rgba(160, 120, 0, 0.25);
  }
  :lang(ja) .row .tag { font-family: "Hiragino Sans", sans-serif; font-size: 13px; }

  /* ---------- hero ---------- */

  #hero .brand { position: absolute; left: 72px; top: 52px; }
  #hero .headline { position: absolute; left: 72px; top: 128px; width: 1100px; }
  #hero .sub { position: absolute; left: 72px; top: 262px; width: 1000px; }
  :lang(ja) #hero .headline { top: 124px; }
  :lang(ja) #hero .sub { top: 264px; }

  .step {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }
  :lang(ja) .step { font-size: 16px; }
  .step i {
    font-style: normal;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 15px;
  }

  .interstitial {
    position: absolute;
    left: 72px;
    top: 390px;
    width: 330px;
    height: 250px;
    border-radius: 14px;
    background: #F7F5FA;
    color: var(--text);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .interstitial .faded { display: contents; }
  .interstitial .app { width: 52px; height: 52px; border-radius: 13px; background: #D9D3E0; opacity: 0.6; }
  .interstitial .title { font-size: 20px; font-weight: 700; opacity: 0.45; }
  .interstitial .hint { font-size: 13px; color: var(--text-2); opacity: 0.7; }
  .interstitial .link {
    position: relative;
    font-size: 14px;
    color: #1264A3;
    text-decoration: underline;
    padding: 5px 10px;
    border-radius: 8px;
    box-shadow: 0 0 0 3px var(--accent);
    background: #fff;
  }
  .interstitial .cursor { position: absolute; right: -22px; bottom: -26px; width: 30px; height: 30px; }
  .interstitial .skipped {
    position: absolute;
    top: -16px;
    right: -14px;
    padding: 7px 14px 7px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  }
  :lang(ja) .interstitial .skipped { font-family: "Hiragino Sans", sans-serif; font-size: 13px; }

  .flow-arrow { position: absolute; left: 420px; top: 495px; width: 130px; height: 40px; }

  #hero .window { left: 570px; top: 390px; width: 640px; height: 460px; }

  /* ---------- highlight ---------- */

  #highlight .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  #highlight .window { left: 560px; top: 70px; width: 660px; height: 800px; }

  .fade { width: 380px; margin-top: 8px; }
  .fade .bar {
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 55%, rgba(242, 199, 68, 0) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }
  .fade .ticks { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: var(--ink-2); }

  /* ---------- trust ---------- */

  #trust .top { position: absolute; left: 72px; right: 72px; top: 100px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  #trust .grid {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 350px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .card {
    height: 290px;
    border-radius: 18px;
    padding: 34px 26px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card .icon {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: rgba(242, 199, 68, 0.14);
    display: grid;
    place-items: center;
    margin-bottom: 10px;
  }
  .card .icon svg { width: 32px; height: 32px; }
  .card h3 { font-size: 23px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
  :lang(ja) .card h3 { font-size: 22px; }
  .card p { font-size: 18px; line-height: 1.55; color: var(--ink-2); }
  :lang(ja) .card p { font-size: 16px; line-height: 1.75; }

  /* ---------- small promo tile (440x280) ---------- */

  #tile { padding: 34px 32px; display: none; flex-direction: column; justify-content: space-between; }
  body[data-screen="tile"] #tile { display: flex; }
  #tile [data-icon] { width: 76px; height: 76px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35)); }
  #tile .mini {
    position: absolute;
    left: 292px;
    top: 26px;
    width: 220px;
    padding: 10px 0;
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  #tile .mini .r { display: flex; align-items: center; gap: 10px; padding: 9px 14px; }
  #tile .mini .r.hl { background: var(--hl); }
  #tile .mini i { width: 22px; height: 22px; border-radius: 6px; background: var(--skeleton); }
  #tile .mini .hl i { background: var(--accent); }
  #tile .mini b { height: 8px; border-radius: 4px; background: var(--skeleton); }
  #tile .mini .hl b { background: #E9D9A3; }
  #tile .name { font-size: 28px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; }
  #tile .tagline { margin-top: 8px; font-size: 17px; color: var(--ink-2); }
  :lang(ja) #tile .name { font-family: "Helvetica Neue", Helvetica, sans-serif; }
  :lang(ja) #tile .tagline { font-size: 16px; }
</style>
</head>
<body>


<section id="hero">
  <div class="brand"><span data-icon></span>Open in Browser for Slack</div>
  <h1 class="headline" data-t="hero.headline"></h1>
  <p class="sub" data-t="hero.sub"></p>

  <div class="step" style="left:72px; top:342px"><i>1</i><span data-t="hero.step1"></span></div>
  <div class="step" style="left:570px; top:342px"><i>2</i><span data-t="hero.step2"></span></div>

  <div class="interstitial">
    <div class="app"></div>
    <div class="title">Launching Slack…</div>
    <div class="hint">If nothing prompts from your browser,</div>
    <div class="link">open this link in your browser
      <svg class="cursor" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z" fill="#fff" stroke="#1D1C1D" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div class="skipped">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-t="hero.skipped"></span>
    </div>
  </div>

  <svg class="flow-arrow" viewBox="0 0 130 40">
    <path d="M6 20 H108" stroke="#F2C744" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M100 8 L118 20 L100 32" fill="none" stroke="#F2C744" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="window" data-window="hero"></div>
  <p class="disclaimer" data-t="disclaimer"></p>
</section>

<section id="highlight">
  <div class="text">
    <h1 class="headline" data-t="hl.headline"></h1>
    <p class="sub" data-t="hl.sub"></p>
    <div class="fade">
      <div class="bar"></div>
      <div class="ticks"><span>0s</span><span>6s</span></div>
    </div>
  </div>
  <div class="window" data-window="highlight"></div>
  <p class="disclaimer" data-t="disclaimer"></p>
</section>

<section id="trust">
  <div class="top">
    <span data-icon style="width:88px; height:88px"></span>
    <h1 class="headline" data-t="trust.headline"></h1>
  </div>
  <div class="grid">
    <div class="card">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#F2C744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
      <h3 data-t="trust.1.h"></h3><p data-t="trust.1.p"></p>
    </div>
    <div class="card">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#F2C744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 4l16 16"/></svg></div>
      <h3 data-t="trust.2.h"></h3><p data-t="trust.2.p"></p>
    </div>
    <div class="card">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#F2C744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
      <h3 data-t="trust.3.h"></h3><p data-t="trust.3.p"></p>
    </div>
    <div class="card">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#F2C744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></div>
      <h3 data-t="trust.4.h"></h3><p data-t="trust.4.p"></p>
    </div>
  </div>
  <p class="disclaimer" data-t="disclaimer"></p>
</section>

<section id="tile">
  <div class="mini">
    <div class="r"><i></i><b style="width:90px"></b></div>
    <div class="r hl"><i></i><b style="width:120px"></b></div>
    <div class="r"><i></i><b style="width:70px"></b></div>
  </div>
  <span data-icon></span>
  <div>
    <div class="name">Open in Browser<br>for Slack</div>
    <div class="tagline" data-t="tile.tagline"></div>
  </div>
</section>

<script>
  const STRINGS = {
    en: {
      "hero.headline": "Slack links open in your browser,<br><span class=\"accent\">not the desktop app.</span>",
      "hero.sub": "Skips the “Launching Slack…” page and highlights the linked message.",
      "hero.step1": "Launch page, skipped",
      "hero.step2": "Opened in the web client",
      "hero.skipped": "Auto-clicked",
      "hl.headline": "Spot the linked message <span class=\"accent\">instantly.</span>",
      "hl.sub": "It glows for a few seconds, then fades away — even in a busy channel.",
      "trust.headline": "Install it. Forget it.",
      "trust.1.h": "No setup",
      "trust.1.p": "Works the moment it is installed. No options page.",
      "trust.2.h": "No popup",
      "trust.2.p": "No toolbar button, nothing to click.",
      "trust.3.h": "No data collected",
      "trust.3.p": "No analytics, no network requests.",
      "trust.4.h": "Open source",
      "trust.4.p": "MIT-licensed. Read every line on GitHub.",
      "tile.tagline": "Slack links → your browser",
      "tag": "Linked message",
      "disclaimer": "Unofficial extension — not affiliated with Slack Technologies, LLC or Salesforce, Inc.",
    },
    ja: {
      "hero.headline": "Slack のリンクを、<br><span class=\"accent\">アプリではなくブラウザで。</span>",
      "hero.sub": "「Slack を起動しています…」画面をスキップして、リンク先をハイライト。",
      "hero.step1": "起動画面を自動スキップ",
      "hero.step2": "ブラウザの Slack で表示",
      "hero.skipped": "自動でクリック",
      "hl.headline": "リンク先が、<br><span class=\"accent\">ひと目で分かる。</span>",
      "hl.sub": "該当メッセージを数秒間ハイライトしてから、自然にフェードアウト。流れの速いチャンネルでも迷いません。",
      "trust.headline": "入れたら、あとは忘れるだけ。",
      "trust.1.h": "設定不要",
      "trust.1.p": "インストールした瞬間から動作。オプション画面もありません。",
      "trust.2.h": "操作不要",
      "trust.2.p": "ツールバーボタンもポップアップもなし。",
      "trust.3.h": "データ収集なし",
      "trust.3.p": "アナリティクスも外部通信も一切なし。",
      "trust.4.h": "オープンソース",
      "trust.4.p": "MIT ライセンス。すべてのコードを GitHub で公開。",
      "tile.tagline": "Slack のリンクをブラウザで開く",
      "tag": "リンク先",
      "disclaimer": "非公式の拡張機能です。Slack Technologies, LLC および Salesforce, Inc. とは関係ありません。",
    },
  };

  // Fictional people; skeleton bars stand in for message text so the mockup
  // needs no translation and does not copy Slack's UI verbatim.
  const PEOPLE = [
    { name: "Mika Sato", color: "#B6A4C9", time: "10:12", lines: [340, 250] },
    { name: "Daniel Lee", color: "#8FB8AA", time: "10:15", lines: [290] },
    { name: "Priya Nair", color: "#A9A6D6", time: "10:21", lines: [380, 310, 170] },
    { name: "Kenji Ito", color: "#D1A7A2", time: "10:34", lines: [320] },
    { name: "Sofia Rossi", color: "#9DBBD6", time: "10:40", lines: [360, 220] },
    { name: "Omar Haddad", color: "#C9B58F", time: "10:52", lines: [300] },
    { name: "Lena Fischer", color: "#A7C7A0", time: "11:03", lines: [350, 260] },
    { name: "Tom Walker", color: "#C4A3C8", time: "11:10", lines: [280] },
  ];

  const WINDOWS = {
    hero: { people: [1, 2, 3, 4], hl: 1 },
    highlight: { people: [5, 0, 6, 1, 2, 3, 4, 7], hl: 4 },
  };

  function renderWindow(el, spec, strings) {
    const rows = spec.people.map((p, i) => {
      const person = PEOPLE[p];
      const isHl = i === spec.hl;
      const lines = person.lines.map(w => `<div class="line" style="width:${w}px"></div>`).join("");
      const tag = isHl
        ? `<div class="tag"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2L8 3.8M9.5 6.5a3 3 0 0 0-4.2 0L2.7 9.1a3 3 0 0 0 4.2 4.2L8 12.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>${strings.tag}</div>`
        : "";
      return `<div class="row${isHl ? " hl" : ""}">
        <div class="avatar" style="background:${isHl ? "#F2C744" : person.color}"></div>
        <div class="body"><div class="meta"><b>${person.name}</b><span>${person.time}</span></div>${lines}</div>${tag}
      </div>`;
    }).join("");
    el.innerHTML = `
      <div class="bar">
        <span class="dot" style="background:#FF5F57"></span>
        <span class="dot" style="background:#FEBC2E"></span>
        <span class="dot" style="background:#28C840"></span>
        <div class="url">
          <svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="6" width="10" height="7.5" rx="2" fill="#8A8290"/><path d="M3.5 6V4.2a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="#8A8290" stroke-width="1.6"/></svg>
          <span><b>app.slack.com</b>/client/T0AB12CD3/C0EF45GH6/p1753672345123456</span>
        </div>
      </div>
      <div class="channel"># team-updates</div>
      ${rows}`;
  }

  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "ja" ? "ja" : "en";
  const strings = STRINGS[lang];
  document.documentElement.lang = lang;
  document.body.dataset.screen = params.get("screen") || "hero";

  document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = '<img src="../../../icons/icon.svg" alt="">'; });
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = strings[el.dataset.t]; });
  document.querySelectorAll("[data-window]").forEach(el => renderWindow(el, WINDOWS[el.dataset.window], strings));
</script>
</body>
</html>
