<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38103E"/>
      <stop offset="1" stop-color="#4A154B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- extension icon motif -->
  <g transform="translate(80,72) scale(0.75)">
    <rect width="128" height="128" rx="28" fill="#4A154B" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
    <path d="M88 66 V78 a14 14 0 0 1 -14 14 H48 l-16 12 v-12 a14 14 0 0 1 -14 -14 V50 a14 14 0 0 1 14 -14 h22"
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 64 L100 28" fill="none" stroke="#ECB22E" stroke-width="12" stroke-linecap="round"/>
    <path d="M76 24 h28 v28" fill="none" stroke="#ECB22E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- headline -->
  <text x="80" y="266" font-size="46" font-weight="bold" fill="#FFFFFF">Slack message links,</text>
  <text x="80" y="324" font-size="46" font-weight="bold" fill="#FFFFFF">opened in your browser.</text>

  <text x="80" y="396" font-size="23" fill="#D9C7DD">Auto-skips the &#8220;Launching Slack&#8230;&#8221; page and highlights</text>
  <text x="80" y="428" font-size="23" fill="#D9C7DD">the linked message in the web client.</text>

  <!-- bullets -->
  <circle cx="88" cy="492" r="5" fill="#ECB22E"/>
  <text x="106" y="500" font-size="22" fill="#F3EAF5">No setup — install and forget</text>
  <circle cx="88" cy="540" r="5" fill="#ECB22E"/>
  <text x="106" y="548" font-size="22" fill="#F3EAF5">No data collection, no network requests</text>
  <circle cx="88" cy="588" r="5" fill="#ECB22E"/>
  <text x="106" y="596" font-size="22" fill="#F3EAF5">Open source (MIT)</text>

  <text x="80" y="744" font-size="14" fill="rgba(255,255,255,0.45)">Unofficial extension — not affiliated with Slack Technologies, LLC or Salesforce, Inc.</text>

  <!-- browser mockup -->
  <g filter="url(#shadow)">
    <rect x="660" y="120" width="540" height="560" rx="14" fill="#FFFFFF"/>
  </g>
  <path d="M660 164 v-30 a14 14 0 0 1 14 -14 h512 a14 14 0 0 1 14 14 v30 z" fill="#EFEAF0"/>
  <circle cx="684" cy="142" r="6" fill="#FF5F57"/>
  <circle cx="704" cy="142" r="6" fill="#FEBC2E"/>
  <circle cx="724" cy="142" r="6" fill="#28C840"/>
  <rect x="748" y="130" width="430" height="24" rx="12" fill="#FFFFFF" stroke="#DDD5DF"/>
  <text x="766" y="147" font-size="13" fill="#8A8290">app.slack.com/client/T0AB12CD3/C0EF45GH6/p1753672345123456</text>

  <text x="688" y="204" font-size="18" font-weight="bold" fill="#1D1C1D"># team-updates</text>
  <line x1="661" y1="222" x2="1199" y2="222" stroke="#ECE6EE" stroke-width="2"/>

  <!-- message rows (skeletons) -->
  <g>
    <rect x="684" y="248" width="36" height="36" rx="8" fill="#B8A5C0"/>
    <rect x="732" y="250" width="90" height="12" rx="6" fill="#D8D1DB"/>
    <rect x="830" y="251" width="40" height="10" rx="5" fill="#EAE5EC"/>
    <rect x="732" y="272" width="340" height="10" rx="5" fill="#E7E2E9"/>
    <rect x="732" y="290" width="260" height="10" rx="5" fill="#E7E2E9"/>
  </g>
  <g>
    <rect x="684" y="336" width="36" height="36" rx="8" fill="#8FB3A9"/>
    <rect x="732" y="338" width="110" height="12" rx="6" fill="#D8D1DB"/>
    <rect x="850" y="339" width="40" height="10" rx="5" fill="#EAE5EC"/>
    <rect x="732" y="360" width="300" height="10" rx="5" fill="#E7E2E9"/>
  </g>
  <!-- highlighted (linked) message -->
  <g>
    <rect x="661" y="412" width="538" height="96" fill="#FBF0C9"/>
    <rect x="684" y="424" width="36" height="36" rx="8" fill="#ECB22E"/>
    <rect x="732" y="426" width="100" height="12" rx="6" fill="#CBB878"/>
    <rect x="840" y="427" width="40" height="10" rx="5" fill="#E4D7A6"/>
    <rect x="732" y="448" width="380" height="10" rx="5" fill="#DCCD96"/>
    <rect x="732" y="466" width="310" height="10" rx="5" fill="#DCCD96"/>
    <rect x="732" y="484" width="180" height="10" rx="5" fill="#DCCD96"/>
  </g>
  <g>
    <rect x="684" y="532" width="36" height="36" rx="8" fill="#A7A2C6"/>
    <rect x="732" y="534" width="80" height="12" rx="6" fill="#D8D1DB"/>
    <rect x="820" y="535" width="40" height="10" rx="5" fill="#EAE5EC"/>
    <rect x="732" y="556" width="330" height="10" rx="5" fill="#E7E2E9"/>
  </g>
  <g>
    <rect x="684" y="620" width="36" height="36" rx="8" fill="#C6A2A2"/>
    <rect x="732" y="622" width="120" height="12" rx="6" fill="#D8D1DB"/>
    <rect x="860" y="623" width="40" height="10" rx="5" fill="#EAE5EC"/>
    <rect x="732" y="644" width="280" height="10" rx="5" fill="#E7E2E9"/>
  </g>

  <!-- callout pointing at the highlighted row -->
  <line x1="612" y1="460" x2="656" y2="460" stroke="#ECB22E" stroke-width="3"/>
  <rect x="402" y="442" width="210" height="36" rx="18" fill="#ECB22E"/>
  <text x="507" y="466" font-size="16" font-weight="bold" fill="#3B1140" text-anchor="middle">Linked message</text>
</svg>
